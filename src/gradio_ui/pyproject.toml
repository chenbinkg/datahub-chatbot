[project]
name = "gradio-ui"
version = "0.1.0"
description = "Gradio UI for MCP Server"
dependencies = [
    "gradio>=3.50.2",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "python-jose>=3.3.0",
    "python-dotenv>=1.0.0"
]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
gradio = ">=3.50.2"
boto3 = ">=1.28.0"
requests = ">=2.31.0"
python-jose = ">=3.3.0"
python-dotenv = ">=1.0.0"