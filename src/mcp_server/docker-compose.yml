version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - AWS_REGION=ap-southeast-2
      - MONGO_URI=mongodb://localhost:27017
      - MONGO_DB=data_platform
    volumes:
      - .:/app:ro  # Mount source code for development
    networks:
      - mcp-network

  # Optional: Local MongoDB for testing
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge