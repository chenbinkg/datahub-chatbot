[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Data Platform"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2", 
    "pymongo>=4.5.0",
    "boto3>=1.28.0",
    "pydantic>=2.4.2",
    "python-dotenv>=1.0.0"
]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
fastapi = ">=0.104.0"
uvicorn = ">=0.23.2"
pymongo = ">=4.5.0"
boto3 = ">=1.28.0"
pydantic = ">=2.4.2"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"