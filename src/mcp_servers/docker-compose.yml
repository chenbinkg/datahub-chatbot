version: '3.8'

services:
  # Unified MCP server container (MongoDB + S3)
  mcp-servers:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # MongoDB MCP
      - "8001:8001"  # S3 Presigned URL MCP
      - "8002:8002"  # Health check
    environment:
      - MONGO_URI=${MONGO_URI}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
    restart: unless-stopped

