name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ENVIRONMENT: dev
  PROJECT_CODE: FPEI2606
  PROJECT_NAME: datahub-mcp

jobs:
  # Security and Quality Checks
  infra-checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run Checkov
        run: ./tasks checkov_alpine
        continue-on-error: true
      - name: Upload Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: results.xml

  scripts-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set execute permissions
        run: chmod +x ./tasks
      - name: Run ShellCheck
        run: ./tasks shellcheck_alpine || true
      - name: Upload ShellCheck Report
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: shellcheck_report.xml

  # Lambda Functions
  lambda-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Package Lambda Functions
        run: |
          # Package MCP Agent Lambda
          function_name="mcp_agent" path_cwd="$PWD/lambda" runtime="python3" bash lambda/scripts/create_pkg.sh

      - name: Upload Lambda Packages
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: infra/2-chatbot-interface/lambda_*.zip

  # Terraform Infrastructure
  terraform-init:
    runs-on: ubuntu-latest
    needs: [infra-checkov]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform Init - Backend Setup
        working-directory: infra/1-terraform-init
        run: |
          export TF_VAR_environment=${{ env.ENVIRONMENT }}
          terraform init
          terraform plan -out=plan.tfplan
          terraform apply -auto-approve plan.tfplan

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: [terraform-init, lambda-package]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infra/2-chatbot-interface/
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform Deploy Infrastructure
        working-directory: infra/2-chatbot-interface
        run: |
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init -reconfigure \
                         -backend-config="bucket=${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-${AWS_ACCOUNT_ID}-terraform-state" \
                         -backend-config="key=${{ env.PROJECT_CODE }}/${{ env.PROJECT_NAME }}/${{ env.ENVIRONMENT }}.tfstate"
          terraform plan -out=plan.tfplan \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="mongo_uri=${{ secrets.MONGO_URI }}" \
            -var="mongo_db=${{ secrets.MONGO_DB }}"
          terraform apply -auto-approve plan.tfplan
      - name: Store Terraform Outputs
        working-directory: infra/2-chatbot-interface
        run: |
          echo "ECR_MCP_SERVER_URL=$(terraform output -raw ecr_mcp_server_url)" >> $GITHUB_ENV
          echo "ECR_GRADIO_UI_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
          echo "ECS_CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_ENV

  # Container Build and Deploy
  build-containers:
    runs-on: ubuntu-latest
    needs: [terraform-deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get ECR URLs from Terraform
        working-directory: infra/2-chatbot-interface
        run: |
          echo "ECR_MCP_SERVER_URL=$(terraform output -raw ecr_mcp_server_url)" >> $GITHUB_ENV
          echo "ECR_GRADIO_UI_URL=$(terraform output -raw ecr_repository_url)" >> $GITHUB_ENV
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - name: Build and Push MCP Server
        working-directory: src/mcp_server
        run: |
          docker buildx build --platform linux/amd64 -t ${{ env.ECR_MCP_SERVER_URL }}:latest --push .
      - name: Build and Push Gradio UI
        working-directory: src/gradio_ui
        run: |
          docker buildx build --platform linux/amd64 -t ${{ env.ECR_GRADIO_UI_URL }}:latest --push .

  deploy-ecs:
    runs-on: ubuntu-latest
    needs: [build-containers]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update ECS Services
        run: |
          # Update MCP Server service
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --service "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-mcp-server" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --no-cli-pager
          
          # Update Gradio UI service
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --service "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-gradio-ui" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --no-cli-pager
      - name: Wait for deployment
        run: |
          echo "Waiting for ECS services to stabilize..."
          aws ecs wait services-stable \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --services "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-mcp-server" \
            --region ${{ env.AWS_REGION }}
          
          aws ecs wait services-stable \
            --cluster "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-cluster" \
            --services "${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-gradio-ui" \
            --region ${{ env.AWS_REGION }}

  # Health Checks and Validation
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-ecs]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Get ALB DNS
        working-directory: infra/2-chatbot-interface
        run: |
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> $GITHUB_ENV
      - name: Health Check
        run: |
          echo "Checking application health at: http://${{ env.ALB_DNS }}"
          # Wait for ALB to be ready
          sleep 60
          
          # Check if the application is responding
          for i in {1..10}; do
            if curl -f -s "http://${{ env.ALB_DNS }}" > /dev/null; then
              echo "✅ Application is healthy"
              exit 0
            fi
            echo "⏳ Attempt $i/10 - waiting for application..."
            sleep 30
          done
          
          echo "❌ Health check failed"
          exit 1

  # Cleanup on PR
  cleanup-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Cleanup PR resources
        run: |
          echo "PR closed - cleanup would happen here for PR-specific resources"